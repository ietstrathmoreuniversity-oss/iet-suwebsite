{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}IET Strathmore Student Chapter — Engineering Tomorrow, Together{% endblock %}</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
  
  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:title" content="{% block og_title %}IET Strathmore Student Chapter — Engineering Tomorrow, Together{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}Join IET Strathmore's dynamic student chapter. We empower young engineers through seminars, networking events, and hands-on projects. Together, we shape the future of engineering at Strathmore University.{% endblock %}" />
  <meta property="og:image" content="{% block og_image %}{{ request.build_absolute_uri }}{% static 'assets/og-image.png' %}{% endblock %}" />
  <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="IET Strathmore" />
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}IET Strathmore Student Chapter{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}Join IET Strathmore's dynamic student chapter. We empower young engineers through seminars, networking events, and hands-on projects.{% endblock %}" />
  <meta name="twitter:image" content="{% block twitter_image %}{{ request.build_absolute_uri }}{% static 'assets/og-image.png' %}{% endblock %}" />
  
  <!-- Additional Meta Tags -->
  <meta name="description" content="IET Strathmore Student Chapter - Empowering engineers through seminars, networking, and innovation." />
  <meta name="keywords" content="IET, Strathmore, Engineering, Student Chapter, Technology, Seminars" />
  <meta name="author" content="IET Strathmore Student Chapter" />
  
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
